<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>생성 체크리스트</title>
  <link rel="stylesheet" href="../../_app/base.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="../../_app/peropix.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <header class="top">
      <div>
        <h1>생성 체크리스트</h1>
        <p id="scope">워크스페이스를 확인하는 중…</p>
      </div>
      <button id="detach" type="button">새 창으로 분리</button>
      <button id="refresh" type="button">새로고침</button>
    </header>
    <p class="guide">건너뛸 조합에 체크하세요. 원하는 결과를 그 자리에 유지하려면 <strong>대표</strong>를 눌러 이미지를 고르세요.</p>
    <p id="notice" hidden></p>
    <details id="companions" hidden>
      <summary id="companionTitle">동반 캐릭터 선택</summary>
      <p>선택한 인물은 모든 주인공과 함께 캐릭터 2번부터 들어갑니다. 그룹을 체크하면 현재 멤버 전체가 선택됩니다. 선택 시 이 탭의 순차 생성이 켜집니다.</p>
      <div id="companionChoices"></div>
    </details>
    <div id="summary" hidden>
      <strong id="remaining"></strong>
      <span id="excluded"></span>
    </div>
    <div id="matrix" tabindex="0" role="region" aria-label="캐릭터와 씬 조합" hidden>
      <table aria-label="건너뛸 캐릭터와 씬 조합">
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="actions" hidden>
      <button id="markAll" type="button">전체 체크</button>
      <button id="clearAll" type="button">전체 해제</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="resort" type="button" hidden>인물별 정렬</button>
  </main>
  <dialog id="picker" aria-labelledby="pickerTitle" aria-describedby="pickerScope">
    <div class="picker-layout">
      <div class="top">
        <div>
          <h2 id="pickerTitle">대표 이미지 선택</h2>
          <p id="pickerScope"></p>
        </div>
        <button type="button" id="closePicker">닫기</button>
      </div>
      <p>파일을 고정하면 이 조합도 체크됩니다. 자동 선택으로 되돌려도 체크는 유지됩니다.</p>
      <p id="takeStatus" role="status" aria-live="polite"></p>
      <div id="takeList" role="radiogroup" aria-label="이 씬의 저장된 이미지"></div>
      <div class="picker-actions">
        <button type="button" id="unpick" disabled>자동 선택으로 되돌리기</button>
        <button type="button" id="usePick" class="primary" disabled>선택한 파일로 고정</button>
      </div>
    </div>
  </dialog>
</body>
</html>
